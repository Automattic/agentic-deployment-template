# vip-template-version: 2
name: "Prepare a Codex run"
description: >-
  Writes the Codex home directory (command rules) and the prompt for one run of
  openai/codex-action. Runs before the agent and never after it: it does not
  invoke Codex.

# Why setup only
#
# A local action is read from disk when its step starts. After an agent step the
# workspace is the agent's, so a local action there would run whatever the agent
# wrote into it. The agent step itself is openai/codex-action, pinned by SHA in
# the calling workflow, and the steps after it are inline.
#
# What bounds Codex
#
# The sandbox, not the rules written here. With permission-profile ":workspace"
# Codex can write the workspace and /tmp and nothing else: .git is read-only,
# $RUNNER_TEMP and $GITHUB_ENV are read-only, the network is off, and
# OPENAI_API_KEY never enters its environment (verified on a runner). The
# `forbidden` rules below match only a command Codex runs directly, not one run
# inside a script, so they stop the obvious call and nothing more. Never add an
# `allow` rule: an allowed command runs outside the sandbox.

inputs:
  mode:
    description: "implement or plan (feedback arrives with vip-agent-pr-feedback.yml)."
    required: true
  issue_number:
    description: "The issue to work on."
    required: false
    default: ""
  issue_title:
    required: false
    default: ""
  issue_body:
    description: "Untrusted. Codex has no network, so the issue travels in the prompt."
    required: false
    default: ""
  plan_path:
    description: "After /approve-plan: the plan file already copied into the workspace."
    required: false
    default: ""
  context:
    description: "Feedback mode: the triggering comment and PR context, already assembled."
    required: false
    default: ""
  tail:
    description: "The shared prompt tail (VIP_PROMPT_CORE)."
    required: true

outputs:
  codex_home:
    value: ${{ steps.prepare.outputs.codex_home }}
  prompt_file:
    value: ${{ steps.prepare.outputs.prompt_file }}
  final_message_file:
    value: ${{ steps.prepare.outputs.final_message_file }}

runs:
  using: composite
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ISSUE: ${{ inputs.issue_number }}
        TITLE: ${{ inputs.issue_title }}
        BODY: ${{ inputs.issue_body }}
        PLAN_PATH: ${{ inputs.plan_path }}
        CONTEXT: ${{ inputs.context }}
        TAIL: ${{ inputs.tail }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/vip-codex"
        out="$RUNNER_TEMP/vip-agent-out"
        mkdir -p "$dir/home/rules" "$out"

        cat > "$dir/home/rules/default.rules" <<'RULES'
        prefix_rule(pattern=["curl"], decision="forbidden", justification="No network tools: the agent works offline.")
        prefix_rule(pattern=["wget"], decision="forbidden", justification="No network tools: the agent works offline.")
        prefix_rule(pattern=["ssh"], decision="forbidden", justification="No network tools: the agent works offline.")
        prefix_rule(pattern=["nc"], decision="forbidden", justification="No network tools: the agent works offline.")
        prefix_rule(pattern=["git", "push"], decision="forbidden", justification="A separate trusted step publishes changes.")
        prefix_rule(pattern=["git", "remote"], decision="forbidden", justification="A separate trusted step publishes changes.")
        RULES

        fence() { printf '~~~~text\n%s\n~~~~\n' "${1//~~~~/~ ~~~}"; }
        {
          case "$MODE" in
            implement)
              echo "You are implementing issue #${ISSUE}: $(printf '%s' "$TITLE" | tr '\n' ' ')"
              echo
              echo "The issue, as its author wrote it:"
              fence "$BODY"
              echo
              if [[ -n "$PLAN_PATH" ]]; then
                echo "A human approved the implementation plan at $PLAN_PATH. It is already in"
                echo "the workspace. Read it in full and implement it, working through its"
                echo "implementation units in order. Leave the plan file where it is."
                echo
              fi
              echo "Instructions:"
              echo "1. Read AGENTS.md, and CLAUDE.md if it exists, for project-specific guidance."
              echo "2. Implement the change so it meets the acceptance criteria exactly."
              echo "3. Stay within the defined scope — \"Out of scope\" is a hard boundary."
              echo "4. Follow the patterns referenced in Technical Notes (read the files listed there)."
              echo "5. Add or update tests, and run them if you can. You have no network access."
              ;;
            plan)
              echo "You are planning the implementation for issue #${ISSUE}: $(printf '%s' "$TITLE" | tr '\n' ' ')"
              echo
              echo "The issue, as its author wrote it:"
              fence "$BODY"
              echo
              echo "This is a vip-complexity:high issue. Your job is to PLAN, not implement."
              echo
              echo "Instructions:"
              echo "1. Read AGENTS.md, and CLAUDE.md if it exists, for project-specific guidance."
              echo "2. Read the key files referenced in Technical Notes to understand the codebase."
              echo "3. Write a structured implementation plan as one markdown file saved to:"
              echo "   docs/plans/YYYY-MM-DD-NNN-<type>-<short-title>-plan.md"
              echo "   It should include: problem frame, requirements, scope boundaries, key"
              echo "   technical decisions, and implementation units (each with goal, files,"
              echo "   approach, and test scenarios)."
              echo "4. Write nothing else. Do NOT write application code."
              ;;
            feedback)
              printf '%s\n' "$CONTEXT"
              echo
              echo "Read AGENTS.md, and CLAUDE.md if it exists, for project-specific guidance."
              ;;
          esac
          echo
          echo "HOW YOUR WORK IS PUBLISHED:"
          echo
          echo "You only edit files. You cannot commit, push, or open a pull request, and you"
          echo "should not try: a separate step publishes your changes when you finish."
          echo "Changes to .github/, .claude/, CODEOWNERS, .gitattributes, .env files and"
          echo "agent settings directories are discarded, so do not make them."
          echo
          echo "End with a final message for the reviewer: what you changed, which acceptance"
          echo "criteria it meets, and anything you could not verify or had to assume. It is"
          echo "published with your changes as written: in the pull request, or in the comment"
          echo "that reports a plan or a fix."
          echo
          printf '%s\n' "$TAIL"
        } > "$dir/prompt.md"

        echo "codex_home=$dir/home" >> "$GITHUB_OUTPUT"
        echo "prompt_file=$dir/prompt.md" >> "$GITHUB_OUTPUT"
        echo "final_message_file=$out/final-message.md" >> "$GITHUB_OUTPUT"
